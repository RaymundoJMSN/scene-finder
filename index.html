<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scene Finder</title>
<style>
  :root { --bg:#111214; --card:#1b1d21; --card2:#232529; --tx:#e8e8ea; --mut:#9a9aa2; --ac:#4ade80; --bd:#2c2e33; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--tx); font:15px/1.45 system-ui,'Segoe UI',sans-serif; }
  header { position:sticky; top:0; z-index:5; background:linear-gradient(#111214f2,#111214e0); backdrop-filter:blur(8px); border-bottom:1px solid var(--bd); padding:14px 20px 10px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:18px; letter-spacing:.3px; white-space:nowrap; }
  h1 b { color:var(--ac); }
  #f { flex:1; min-width:240px; }
  #q { width:100%; padding:10px 14px; border-radius:10px; border:1px solid var(--bd); background:var(--card); color:var(--tx); font-size:16px; outline:none; }
  #q:focus { border-color:var(--ac); }
  .meta { display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; font-size:13px; color:var(--mut); }
  button, .ebtn { background:var(--card2); color:var(--tx); border:1px solid var(--bd); border-radius:8px; padding:5px 12px; font-size:13px; cursor:pointer; }
  button:hover, .ebtn:hover { border-color:var(--ac); color:var(--ac); }
  main { max-width:1500px; margin:0 auto; padding:16px 20px 60px; }
  h2 { font-size:15px; margin:18px 0 10px; color:var(--mut); text-transform:uppercase; letter-spacing:1px; }
  h3 { font-size:13px; margin:14px 0 8px; color:var(--mut); font-weight:600; }
  h3 .st { font-weight:400; opacity:.8; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:10px; overflow:hidden; cursor:pointer; transition:transform .08s, border-color .08s; position:relative; }
  .card:hover { transform:translateY(-2px); border-color:var(--ac); }
  .card img { width:100%; aspect-ratio:16/10; object-fit:cover; display:block; background:#0c0d0f; }
  .card .inf { padding:8px 10px; }
  .card .nm { font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card .sb { font-size:11px; color:var(--mut); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px; }
  .badge { position:absolute; top:6px; left:6px; background:#111214cc; border-radius:6px; padding:2px 7px; font-size:11px; color:var(--ac); }
  .acoes { position:absolute; top:6px; right:6px; display:flex; gap:4px; align-items:center; }
  .pill { background:#111214e6; border-radius:6px; padding:2px 7px; font-size:12px; line-height:1.5; display:none; }
  .pill:hover { color:var(--ac); }
  .card:hover .pill { display:block; }
  .pill.vars { display:block; color:var(--ac); font-size:11px; }
  .varbox { grid-column:1/-1; background:#0d0e10; border:1px solid var(--ac); border-radius:10px; padding:12px; margin:2px 0 6px; }
  .vartit { font-size:12px; color:var(--mut); margin-bottom:10px; text-transform:uppercase; letter-spacing:.6px; }
  .simtit { font-size:14px; margin-bottom:12px; color:var(--mut); }
  .simtit b { color:var(--tx); }
  .volta { color:var(--ac); cursor:pointer; text-decoration:underline; }
  #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--ac); color:#04240f; font-weight:600; padding:9px 20px; border-radius:99px; transition:transform .18s; z-index:9; }
  #toast.on { transform:translateX(-50%) translateY(0); }
  .empty { color:var(--mut); font-size:13px; padding:8px 0; }
  #spin { display:none; color:var(--ac); }
  .idx-on { color:var(--ac) !important; }
  #upd { display:none; background:#153d26; border-bottom:1px solid var(--ac); padding:9px 20px; font-size:13px; align-items:center; gap:12px; }
  #upd.on { display:flex; }
  #cfg { display:none; background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:16px; margin-bottom:16px; }
  #cfg.on { display:block; }
  #cfg h4 { font-size:13px; color:var(--mut); text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; font-weight:600; }
  .pasta { display:flex; gap:8px; align-items:center; background:var(--card2); border-radius:8px; padding:6px 10px; margin-bottom:6px; font-size:13px; }
  .pasta code { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:ui-monospace,Consolas,monospace; }
  .pasta button { padding:2px 9px; }
  #novaPasta { flex:1; min-width:200px; padding:7px 11px; border-radius:8px; border:1px solid var(--bd); background:var(--bg); color:var(--tx); font-size:13px; }
  .dim { color:var(--mut); font-size:12px; margin-top:10px; }
  .dica { font-weight:400; text-transform:none; letter-spacing:0; opacity:.75; margin-left:8px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { display:flex; align-items:center; gap:7px; background:var(--card2); border:1px solid var(--bd); border-radius:999px; padding:5px 13px; font-size:13px; cursor:pointer; user-select:none; }
  .chip:hover { border-color:var(--ac); }
  .chip.off { opacity:.45; }
  .chip .dot { width:8px; height:8px; border-radius:50%; background:var(--ac); }
  .chip.off .dot { background:var(--mut); }
  .pasta .sw { cursor:pointer; user-select:none; padding:2px 8px; border-radius:6px; border:1px solid var(--bd); font-size:12px; }
  .pasta .sw.on { color:var(--ac); border-color:var(--ac); }
  .pasta.off code { opacity:.45; text-decoration:line-through; }
  .pasta .cnt { color:var(--mut); font-size:12px; white-space:nowrap; }
</style>
</head>
<body>
<div id="upd">
  <span id="updTxt">Nova versão disponível</span>
  <button id="updBtn">Baixar e instalar</button>
  <span style="flex:1"></span>
  <button id="updNao">agora não</button>
</div>
<header>
  <div class="row">
    <h1>Scene <b>Finder</b></h1>
    <form id="f"><input id="q" placeholder="taverna à noite, jungle temple, nave abandonada…" autocomplete="off" autofocus></form>
    <span id="spin">buscando…</span>
  </div>
  <div class="meta">
    <span id="count">—</span>
    <button id="reix" title="Procura imagens novas nas pastas e indexa só elas">↻ Atualizar índice</button>
    <button id="cfgBtn" title="Pastas e configurações">⚙ Pastas</button>
    <span style="flex:1"></span>
    <span>abrir em:</span>
    <span class="ebtn" data-u="https://lostatlas.co/?s={Q}">Lost Atlas</span>
    <span class="ebtn" data-u="https://jamesrpgart.com/search?q={Q}">JamesRPGArt</span>
    <span class="ebtn" data-u="https://www.google.com/search?tbm=isch&q={Q}+rpg+battle+map">Google Img</span>
  </div>
</header>
<main>
  <div id="cfg">
    <h4>Pastas indexadas <span class="dica">desmarque para esconder da busca (sem reindexar)</span></h4>
    <div id="pastas"></div>
    <div class="row" style="margin-top:10px">
      <input id="novaPasta" placeholder="caminho da pasta com seus mapas">
      <button id="procurar">Procurar…</button>
      <button id="addPasta">Adicionar</button>
      <span style="flex:1"></span>
      <button id="salvarCfg" title="indexa só as imagens novas; o que já está no índice é mantido">Salvar e indexar o que falta</button>
    </div>
    <h4 style="margin-top:18px">Fontes online</h4>
    <div id="fontes" class="chips"></div>
    <div class="dim" id="cfgInfo"></div>
  </div>
  <section>
    <h2>Local <span id="lstat" class="st"></span></h2>
    <div id="local"><div class="empty">Digite e aperte Enter.</div></div>
  </section>
  <section>
    <h2>Online</h2>
    <div id="online"><div class="empty">Resultados de Reddit, kemono e Czepeku aparecem aqui.</div></div>
  </section>
</main>
<div id="toast">caminho copiado</div>
<script>
const $ = s => document.querySelector(s);
// promise, nao array: buscar logo ao abrir nao pode perder as fontes online
let SOURCES = fetch('/api/sources').then(r => r.json()).catch(() => ({ativas: [], todas: []}));
let lastQ = '';

function recarregarFontes() {
  SOURCES = fetch('/api/sources').then(r => r.json()).catch(() => ({ativas: [], todas: []}));
  return SOURCES;
}

const esc = s => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1600);
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  toast('caminho copiado');
}

function cardLocal(r) {
  const d = document.createElement('div');
  d.className = 'card';
  d.title = 'clique: copiar caminho · shift+clique: abrir pasta · botão direito: ver a imagem';
  const n = (r.variants || []).length;
  d.innerHTML = `<img loading="lazy" src="${r.thumb}">
    <span class="acoes">
      ${n ? `<span class="pill vars" title="ver as ${n} variantes">${n + 1} variantes</span>` : ''}
      <span class="pill sim" title="mapas parecidos com este">≈</span>
      <span class="pill fold" title="abrir pasta">📁</span>
    </span>
    <div class="inf"><div class="nm">${esc(r.name)}</div>
    <div class="sb" title="${esc(r.foundry)}">${esc(r.dir)} · ${(r.score*100|0)}%</div></div>`;

  d.onclick = e => {
    if (e.shiftKey) { fetch(`/api/open?i=${r.i}`); toast('abrindo a pasta'); }
    else copy(r.foundry);
  };
  d.oncontextmenu = e => {
    e.preventDefault();               // sem menu do navegador dentro do app
    fetch(`/api/view?i=${r.i}`);
    toast('abrindo a imagem');
  };
  d.querySelector('.fold').onclick = e => {
    e.stopPropagation();
    fetch(`/api/open?i=${r.i}`);
    toast('abrindo a pasta');
  };
  d.querySelector('.sim').onclick = e => { e.stopPropagation(); similares(r.i); };

  const vb = d.querySelector('.vars');
  if (vb) vb.onclick = e => { e.stopPropagation(); expandir(d, r); };
  return d;
}

// mostra as variantes logo abaixo do card, sem sair da busca
function expandir(card, r) {
  const antigo = card.parentElement.querySelector('.varbox');
  const meu = antigo && antigo.dataset.i === String(r.i);
  if (antigo) antigo.remove();
  if (meu) return;

  const box = document.createElement('div');
  box.className = 'varbox';
  box.dataset.i = r.i;
  box.innerHTML = `<div class="vartit">${esc(r.name)} — todas as variantes</div>`;
  const g = document.createElement('div');
  g.className = 'grid';
  [r, ...r.variants].forEach(v => g.appendChild(cardLocal({...v, variants: []})));
  box.appendChild(g);
  card.parentElement.insertBefore(box, card.nextSibling);
  box.scrollIntoView({block: 'nearest', behavior: 'smooth'});
}

async function similares(i) {
  const el = $('#local');
  el.innerHTML = '<div class="empty">procurando parecidos…</div>';
  $('#online').innerHTML = '';
  const r = await (await fetch(`/api/similar?i=${i}`)).json();
  el.innerHTML = '';
  if (r.base) {
    const t = document.createElement('div');
    t.className = 'simtit';
    t.innerHTML = `parecidos com <b>${esc(r.base.name)}</b> · <span class="volta">voltar à busca</span>`;
    t.querySelector('.volta').onclick = () => $('#f').requestSubmit();
    el.appendChild(t);
  }
  const g = document.createElement('div');
  g.className = 'grid';
  (r.results || []).forEach(x => g.appendChild(cardLocal(x)));
  el.appendChild(g);
}

function cardOnline(r) {
  const d = document.createElement('div');
  d.className = 'card';
  const img = r.thumb ? `/api/img?u=${encodeURIComponent(r.thumb)}` : '';
  d.innerHTML = `${img ? `<img loading="lazy" src="${img}">` : '<img>'}
    <span class="badge">${esc(r.source)}</span>
    <div class="inf"><div class="nm" title="${esc(r.title)}">${esc(r.title)}</div>
    <div class="sb">abrir post ↗</div></div>`;
  d.onclick = () => fetch(`/api/ext?u=${encodeURIComponent(r.url)}`);
  return d;
}

async function searchLocal(q) {
  const r = await (await fetch(`/api/search?q=${encodeURIComponent(q)}`)).json();
  const el = $('#local');
  el.innerHTML = '';
  if (!r.ready) { el.innerHTML = '<div class="empty">modelo carregando, tenta de novo em segundos…</div>'; return; }
  if (!r.results.length) { el.innerHTML = '<div class="empty">nada no acervo local.</div>'; return; }
  const g = document.createElement('div');
  g.className = 'grid';
  r.results.forEach(x => g.appendChild(cardLocal(x)));
  el.appendChild(g);
}

async function searchOnline(q) {
  const on = $('#online');
  on.innerHTML = '';
  const fontes = (await SOURCES).ativas || [];
  if (!fontes.length) { on.innerHTML = '<div class="empty">nenhuma fonte online ligada (⚙ Pastas).</div>'; return; }
  fontes.forEach(s => {
    const sec = document.createElement('div');
    sec.innerHTML = `<h3>${esc(s.label)} <span class="st">carregando…</span></h3><div class="grid"></div>`;
    on.appendChild(sec);
    const st = sec.querySelector('.st'), grid = sec.querySelector('.grid');
    fetch(`/api/online?q=${encodeURIComponent(q)}&src=${encodeURIComponent(s.id)}`)
      .then(r => r.json())
      .then(r => {
        if (q !== lastQ) return;
        // mostra o termo traduzido quando difere: "Reddit 12 · buscou tavern night"
        const tr = (r.q && r.q.toLowerCase() !== q.toLowerCase()) ? ` · buscou "${esc(r.q)}"` : '';
        st.textContent = r.error ? 'falhou' : `${r.results.length}${tr}`;
        r.results.forEach(x => grid.appendChild(cardOnline(x)));
        if (!r.results.length && !r.error) grid.innerHTML = '<div class="empty">nada.</div>';
      })
      .catch(() => { st.textContent = 'falhou'; });
  });
}

// Enter direto no input (webviews as vezes nao fazem implicit submission)
$('#q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); $('#f').requestSubmit(); }
});

$('#f').onsubmit = e => {
  e.preventDefault();
  const q = $('#q').value.trim();
  if (!q) return;
  lastQ = q;
  $('#spin').style.display = 'inline';
  Promise.allSettled([searchLocal(q)]).then(() => $('#spin').style.display = 'none');
  searchOnline(q);
};

document.querySelectorAll('.ebtn').forEach(b => {
  b.onclick = () => {
    const q = $('#q').value.trim() || lastQ;
    fetch(`/api/ext?u=${encodeURIComponent(b.dataset.u.replace('{Q}', encodeURIComponent(q)))}`);
  };
});

async function pollStatus(loop) {
  const s = await (await fetch('/api/index/status')).json();
  const c = $('#count'), r = $('#reix');
  if (s.running) {
    // deixa explicito que o já indexado não é refeito
    if (s.novos === null || s.novos === undefined) {
      c.textContent = 'procurando imagens novas…';
    } else if (s.novos === 0) {
      c.textContent = `nada novo — ${s.ja} já indexadas`;
    } else {
      const feitas = Math.max(0, s.done - s.ja);
      c.textContent = `indexando ${feitas}/${s.novos} novas (${s.ja} já prontas)`;
    }
    c.classList.add('idx-on');
    r.disabled = true;
    setTimeout(() => pollStatus(true), 1000);
  } else {
    c.textContent = `${s.indexed} mapas no índice`;
    c.classList.remove('idx-on');
    r.disabled = false;
    if (s.error) c.textContent += ` (erro: ${s.error})`;
    if (loop && lastQ) searchLocal(lastQ);  // terminou de indexar -> refaz busca
  }
}

$('#reix').onclick = async () => { await fetch('/api/reindex', {method:'POST'}); pollStatus(true); };

pollStatus(false);

// ---------- pastas ----------
let CFG = null;

async function renderPastas() {
  const el = $('#pastas');
  const info = await (await fetch('/api/folders')).json();
  el.innerHTML = '';
  if (!CFG.folders.length) { el.innerHTML = '<div class="empty">Nenhuma pasta. Adicione onde ficam seus mapas.</div>'; return; }
  CFG.folders.forEach((f, i) => {
    const cam = (typeof f === 'string') ? f : (f.caminho || '');
    const st = info.find(x => x.path === cam) || {on: true, itens: 0};
    const d = document.createElement('div');
    d.className = 'pasta' + (st.on ? '' : ' off');
    // pasta com filtro proprio (peças) merece aviso: o padrão é outro
    const regra = (st.min_side && st.min_side !== 1024)
      ? `<span class="cnt" title="filtro próprio desta pasta">≥${st.min_side}px</span>` : '';
    d.innerHTML = `<span class="sw ${st.on ? 'on' : ''}">${st.on ? '● na busca' : '○ oculta'}</span>
      <code title="${esc(cam)}">${esc(cam)}</code>
      ${regra}
      <span class="cnt">${st.itens} imagens</span>
      <button>remover</button>`;
    d.querySelector('.sw').onclick = async () => {
      await fetch('/api/toggle', {method:'POST',
        body: JSON.stringify({tipo:'pasta', alvo:cam, on: !st.on})});
      toast(st.on ? 'pasta oculta da busca' : 'pasta de volta na busca');
      await renderPastas();
      if (lastQ) searchLocal(lastQ);
    };
    d.querySelector('button').onclick = () => { CFG.folders.splice(i, 1); renderPastas(); };
    el.appendChild(d);
  });
}

async function renderFontes() {
  const el = $('#fontes');
  const { todas } = await (await fetch('/api/sources')).json();
  el.innerHTML = '';
  (todas || []).forEach(s => {
    const c = document.createElement('span');
    c.className = 'chip' + (s.on ? '' : ' off');
    c.innerHTML = `<span class="dot"></span>${esc(s.label)}`;
    c.onclick = async () => {
      await fetch('/api/toggle', {method:'POST',
        body: JSON.stringify({tipo:'fonte', alvo:s.id, on: !s.on})});
      await recarregarFontes();
      await renderFontes();
      if (lastQ) searchOnline(lastQ);
    };
    el.appendChild(c);
  });
}

async function abrirCfg() {
  const r = await (await fetch('/api/config')).json();
  CFG = r.config;
  await renderPastas();
  await renderFontes();
  $('#cfgInfo').textContent =
    `versão ${r.version} · rodando na ${r.motor || '?'} · dados em ${r.data_dir}` +
    (r.sugestao && !CFG.folders.length ? ` · Foundry detectado: ${r.sugestao}` : '');
  if (r.sugestao && !CFG.folders.length) $('#novaPasta').value = r.sugestao;
  $('#cfg').classList.add('on');
}

$('#cfgBtn').onclick = () => {
  const box = $('#cfg');
  box.classList.contains('on') ? box.classList.remove('on') : abrirCfg();
};

$('#addPasta').onclick = () => {
  const v = $('#novaPasta').value.trim();
  if (!v || !CFG) return;
  if (!CFG.folders.includes(v)) CFG.folders.push(v);
  $('#novaPasta').value = '';
  renderPastas();
};

$('#procurar').onclick = async () => {
  const r = await (await fetch('/api/pick')).json();
  if (r.path) $('#novaPasta').value = r.path;
  else if (r.sem_dialogo) toast('só dentro do app; cole o caminho');
};

$('#salvarCfg').onclick = async () => {
  if (!CFG) return;
  await fetch('/api/config', {method:'POST', body: JSON.stringify({folders: CFG.folders})});
  $('#cfg').classList.remove('on');
  toast('salvo, reindexando');
  await fetch('/api/reindex', {method:'POST'});
  pollStatus(true);
};

$('#novaPasta').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); $('#addPasta').click(); }
});

// ---------- update ----------
async function checarUpdate() {
  const u = await (await fetch('/api/update')).json();
  if (!u.available) { if (!u.checked) setTimeout(checarUpdate, 4000); return; }
  const mb = Math.round((u.available.size || 0) / 1e6);
  $('#updTxt').textContent = `Scene Finder ${u.available.version} disponível (você tem ${u.version}${mb ? `, ${mb} MB` : ''})`;
  $('#upd').classList.add('on');
}

$('#updBtn').onclick = async () => {
  const btn = $('#updBtn');
  btn.disabled = true;
  await fetch('/api/update/download', {method:'POST'});
  const t = setInterval(async () => {
    const u = await (await fetch('/api/update')).json();
    if (u.downloading) { $('#updTxt').textContent = `baixando… ${u.progress}%`; return; }
    clearInterval(t);
    if (u.file) {
      $('#updTxt').textContent = 'abrindo instalador — o app vai fechar';
      await fetch('/api/update/install', {method:'POST'});
    } else {
      $('#updTxt').textContent = `falhou: ${u.error || 'erro no download'}`;
      btn.disabled = false;
    }
  }, 700);
};

$('#updNao').onclick = () => $('#upd').classList.remove('on');
checarUpdate();
</script>
</body>
</html>
